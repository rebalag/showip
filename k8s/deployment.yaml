apiVersion: apps/v1
kind: Deployment
metadata:
  name: showip
  namespace: showip
  labels:
    app: showip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showip
  template:
    metadata:
      labels:
        app: showip
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: showip
          image: rebala/showip:327f1c3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: showip
  namespace: showip
spec:
  type: LoadBalancer
  # Preserves the real client source IP for LoadBalancer/NodePort traffic
  externalTrafficPolicy: Local
  selector:
    app: showip
  ports:
    - name: http
      port: 80
      targetPort: http
